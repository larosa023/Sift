name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$proj = Get-Content src/Sift/Sift.csproj
            $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building Sift $v"

      - name: Publish single-file exe
        run: >
          dotnet publish src/Sift/Sift.csproj -c Release -r win-x64 -o out
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Smoke test (launch, scan, run checks, recycle, update check)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          $p = Start-Process out/Sift.exe -ArgumentList '--smoke', '"C:\Program Files"', "`"$log`"" -PassThru
          if (-not $p.WaitForExit(480000)) { $p.Kill(); Write-Host 'Timed out' }
          if (Test-Path $log) { Get-Content $log }
          $crash = Join-Path $env:LOCALAPPDATA 'Sift\crash.log'
          if (Test-Path $crash) { Write-Host '--- crash.log ---'; Get-Content $crash }
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern 'SMOKE OK' -Quiet)) { throw "Smoke test failed (exit $($p.ExitCode))" }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash out/Sift.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Sift.exe" | Out-File -Encoding ascii -NoNewline out/Sift.exe.sha256
          Get-Item out/Sift.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Sift-${{ steps.ver.outputs.version }}
          path: |
            out/Sift.exe
            out/Sift.exe.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sift ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            out/Sift.exe
            out/Sift.exe.sha256
