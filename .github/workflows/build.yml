name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Work out version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            [xml]$proj = Get-Content src/Sift/Sift.csproj
            $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building Sift $v"

      - name: Publish single-file exe
        run: >
          dotnet publish src/Sift/Sift.csproj -c Release -r win-x64 -o out
          -p:Version=${{ steps.ver.outputs.version }}

      - name: Smoke test (launch, scan, run checks, recycle, update check)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'smoke.log'
          $p = Start-Process out/Sift.exe -ArgumentList '--smoke', '"C:\Program Files\dotnet"', "`"$log`"" -PassThru
          if (-not $p.WaitForExit(480000)) { $p.Kill(); Write-Host 'Timed out' }
          if (Test-Path $log) { Get-Content $log }
          $crash = Join-Path $env:LOCALAPPDATA 'Sift\crash.log'
          if (Test-Path $crash) { Write-Host '--- crash.log ---'; Get-Content $crash }
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern 'SMOKE OK' -Quiet)) { throw "Smoke test failed (exit $($p.ExitCode))" }

      - name: Single instance, hand-over and --quit
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = (Resolve-Path out/Sift.exe).Path
          $first = Start-Process $exe -PassThru
          Start-Sleep -Seconds 8
          $second = Start-Process $exe -ArgumentList '"C:\Windows\Fonts"' -PassThru
          if (-not $second.WaitForExit(20000)) { $second.Kill(); throw 'A second launch did not hand its folder to the running Sift' }
          Write-Host "second launch handed over and exited ($($second.ExitCode))"
          if ($first.HasExited) { throw 'The running Sift exited unexpectedly' }
          $quit = Start-Process $exe -ArgumentList '--quit' -PassThru -Wait
          Write-Host "--quit exited with $($quit.ExitCode)"
          if (-not $first.WaitForExit(20000)) { $first.Kill(); throw 'Sift did not close on --quit' }
          if ($quit.ExitCode -ne 0) { throw '--quit reported a failure' }
          Write-Host 'Single instance OK'

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots/*.png
          if-no-files-found: ignore

      # Artifacts live on blob storage; a branch is easier to pull from anywhere git works.
      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $shots = Join-Path $env:RUNNER_TEMP 'shots'
          if (-not (Test-Path $shots)) { exit 0 }
          $d = Join-Path $env:RUNNER_TEMP 'shotrepo'
          New-Item -ItemType Directory $d | Out-Null
          Copy-Item "$shots\*.png" $d
          Copy-Item (Join-Path $env:RUNNER_TEMP 'smoke.log') $d -ErrorAction SilentlyContinue
          Set-Location $d
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for $env:GITHUB_SHA"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-screenshots

      - name: Updater test (old build updates itself to the latest release)
        if: github.event_name != 'pull_request'
        shell: pwsh
        timeout-minutes: 10
        run: |
          dotnet publish src/Sift/Sift.csproj -c Release -r win-x64 -o old -p:Version=0.0.1 | Out-Null
          $log = Join-Path $env:RUNNER_TEMP 'update.log'
          $exe = (Resolve-Path old/Sift.exe).Path
          $p = Start-Process $exe -ArgumentList '--update-test', "`"$log`"" -PassThru
          $p.WaitForExit(300000) | Out-Null
          Start-Sleep -Seconds 8
          Get-Content $log
          $v = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "old/Sift.exe is now version $v"
          Get-Process Sift -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($v -like '0.0.1*') { throw 'Updater did not replace the exe' }

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash out/Sift.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Sift.exe" | Out-File -Encoding ascii -NoNewline out/Sift.exe.sha256
          "$h  Sift.exe" | Out-File -Encoding ascii out/SHA256SUMS.txt
          Get-Item out/Sift.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: Sift-${{ steps.ver.outputs.version }}
          path: |
            out/Sift.exe
            out/Sift.exe.sha256
            out/SHA256SUMS.txt

      - name: Is this version already released?
        id: rel
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.ver.outputs.version }}"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          $exists = ($LASTEXITCODE -eq 0)
          "exists=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "$tag already released: $exists"
          $global:LASTEXITCODE = 0

      # Release on a pushed tag, or when main carries a <Version> that has no release yet.
      - name: Publish GitHub release
        if: >
          startsWith(github.ref, 'refs/tags/v') ||
          (github.ref == 'refs/heads/main' && steps.rel.outputs.exists == 'false')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sift ${{ steps.ver.outputs.version }}
          body_path: CHANGELOG-latest.md
          make_latest: true
          files: |
            out/Sift.exe
            out/Sift.exe.sha256
            out/SHA256SUMS.txt
